name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pipx install ruff==0.15.19
      - run: ruff check .
      - run: ruff format --check .

  # The platform without a single optional extra. This is the interesting job: it proves the
  # claim the README makes -- that a deployment with no ifcopenshell, no trimesh and no pyproj
  # still imports and still runs all fifteen capability families.
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: No extras are installed
        # Without this the job would pass just as happily if `[dev]` quietly pulled an extra in,
        # and the whole point of the job would evaporate without anything going red.
        run: |
          python -c "
          from massingviser.adapters import REQUIREMENTS, available, missing
          assert available() == (), f'expected no extras, found {available()}'
          # Derived from the registry, not hardcoded: adding an adapter must not break this job.
          assert set(missing()) == set(REQUIREMENTS), (set(missing()), set(REQUIREMENTS))
          print(f'no extras present, as intended; {len(REQUIREMENTS)} declared')
          "
      - run: pytest

  # Every extra installed, on both a POSIX and a Windows runner. Path handling in the filesystem
  # storage adapter and the ICDD container layout are the parts that care.
  full:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[all,dev]"
      - name: Every extra is installed
        run: |
          python -c "
          from massingviser.adapters import REQUIREMENTS, available, missing
          # missing() maps adapter -> why it could not load, so a failure names the reason.
          assert not missing(), f'extras failed to install: {missing()}'
          assert set(available()) == set(REQUIREMENTS), (set(available()), set(REQUIREMENTS))
          print(f'all {len(REQUIREMENTS)} adapters present')
          "
      - run: pytest

  # The browser layer's reader, tested against buffers the Python encoder wrote. This is the only
  # place the two implementations of the wire format actually meet, so it regenerates the fixtures
  # from source rather than trusting the checked-in copies -- a Python-side change that breaks the
  # contract fails here rather than being papered over by a stale fixture.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e "."
      - run: python web/test/generate_fixtures.py
      - name: Fixtures are current
        run: git diff --exit-code -- web/test/fixtures
      - run: node --test test/*.test.mjs
        working-directory: web

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
